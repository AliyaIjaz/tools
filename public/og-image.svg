<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#0a0a0f"/>
  <!-- Background grid -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <!-- Glow blobs -->
  <ellipse cx="200" cy="150" rx="300" ry="200" fill="rgba(139,92,246,0.08)"/>
  <ellipse cx="1000" cy="480" rx="280" ry="180" fill="rgba(59,130,246,0.08)"/>
  <ellipse cx="600" cy="315" rx="200" ry="150" fill="rgba(139,92,246,0.04)"/>
  <!-- Border frame -->
  <rect x="1" y="1" width="1198" height="628" rx="0" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>
  <!-- Logo mark -->
  <rect x="80" y="80" width="48" height="48" rx="12" fill="rgba(139,92,246,0.2)" stroke="rgba(139,92,246,0.4)" stroke-width="1.5"/>
  <text x="104" y="113" font-family="monospace" font-size="22" font-weight="700" fill="#a78bfa" text-anchor="middle">Z</text>
  <!-- Site name -->
  <text x="148" y="113" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="rgba(255,255,255,0.9)" letter-spacing="2">ZENVEEL</text>
  <!-- Main headline -->
  <text x="80" y="290" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="-1">Free Online Tools</text>
  <text x="80" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" letter-spacing="-1">
    <tspan fill="#a78bfa">for Developers</tspan>
  </text>
  <!-- Subline -->
  <text x="80" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="26" fill="rgba(255,255,255,0.5)" font-weight="400">55+ tools · No signup · Nothing uploaded · Runs in your browser</text>
  <!-- Tool pills -->
  <rect x="80" y="500" width="160" height="44" rx="22" fill="rgba(139,92,246,0.15)" stroke="rgba(139,92,246,0.3)" stroke-width="1"/>
  <text x="160" y="527" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="rgba(255,255,255,0.8)" text-anchor="middle" font-weight="500">JSON Formatter</text>

  <rect x="256" y="500" width="166" height="44" rx="22" fill="rgba(59,130,246,0.15)" stroke="rgba(59,130,246,0.3)" stroke-width="1"/>
  <text x="339" y="527" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="rgba(255,255,255,0.8)" text-anchor="middle" font-weight="500">Image Converter</text>

  <rect x="438" y="500" width="166" height="44" rx="22" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
  <text x="521" y="527" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="rgba(255,255,255,0.8)" text-anchor="middle" font-weight="500">CSS Gradient</text>

  <rect x="620" y="500" width="150" height="44" rx="22" fill="rgba(245,158,11,0.15)" stroke="rgba(245,158,11,0.3)" stroke-width="1"/>
  <text x="695" y="527" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="rgba(255,255,255,0.8)" text-anchor="middle" font-weight="500">Word Counter</text>

  <rect x="786" y="500" width="148" height="44" rx="22" fill="rgba(139,92,246,0.15)" stroke="rgba(139,92,246,0.3)" stroke-width="1"/>
  <text x="860" y="527" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="rgba(255,255,255,0.8)" text-anchor="middle" font-weight="500">Regex Tester</text>

  <!-- URL badge -->
  <rect x="940" y="86" width="180" height="36" rx="18" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="1030" y="109" font-family="monospace" font-size="13" fill="rgba(255,255,255,0.45)" text-anchor="middle">zenveel.com</text>
</svg>
